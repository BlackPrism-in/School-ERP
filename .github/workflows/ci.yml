name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - run: npm ci
      - run: npm ci --prefix api

      - name: Typecheck API
        run: npm run typecheck --prefix api
      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint API
        run: npm run lint --prefix api
      - name: Lint frontend
        run: npm run lint

      - name: Build API
        run: npm run build --prefix api
      - name: Build frontend
        run: npm run build

  schema:
    name: Database invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Runs every migration then asserts the 13 invariant groups, including
      # tenant isolation as the non-superuser erp_app role. Also the earliest
      # signal that a migration is broken.
      - name: Schema smoke test
        run: ./scripts/db-test.sh

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/edunova_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci --prefix api
      - run: npm test --prefix api

  web-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/edunova_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci
      - run: npm ci --prefix api
      - run: npx playwright install --with-deps chromium

      # Drives the six school journeys and scans every screen with axe against
      # WCAG 2.1 AA, using the production build rather than the dev server.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails the build on high or critical only. Moderate advisories in dev
      # tooling should not block a fee receipt from shipping.
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix api
